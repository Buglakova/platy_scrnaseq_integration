
atlas:
  adata_path: "data/scrnaseq_atlas/atlas_6dpf.h5ad"
  gene_metadata_path: "data/scrnaseq_atlas/genes_metadata.tsv" 
  cluster_column: "broad.types"
  weighted: true
  profile_constant: 0.001

spatial data:
  - name: "smfish"
    table_path: "data/smfish/expression_matrix_aggregated_spots.tsv"
    bin_thresh: 20
  - name: "prospr"
    table_path: "data/smfish/prospr_genes_nuclei.tsv"
    bin_thresh: 0.1

run:
  diagnostics: true
  visualize: true